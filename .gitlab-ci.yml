image: rust:latest

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

cache:
  key: $CI_JOB_NAME-v2
  paths:
    - .cargo/bin/
    # Install metadata, without which `cargo install` refuses to overwrite cached binaries.
    - .cargo/.crates.toml
    - .cargo/.crates2.json
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - target/

stages:
  - lint
  - test
  - verify

fmt:
  stage: lint
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --check

clippy:
  stage: lint
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-targets --all-features -- -D warnings

deny:
  stage: lint
  before_script:
    - cargo install --locked cargo-deny
  script:
    - cargo deny check

test:
  stage: test
  script:
    - cargo test --all-features

build-no-std:
  stage: test
  before_script:
    - rustup target add thumbv7em-none-eabihf
  script:
    - cargo build --target thumbv7em-none-eabihf

msrv:
  stage: test
  image: rust:1.85
  script:
    - cargo check

kani:
  stage: verify
  before_script:
    - cargo install --locked kani-verifier
    - cargo kani setup
  script:
    - cargo kani
