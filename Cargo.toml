[package]
name = "space-packet"
description = "Rust implementation of the CCSDS Space Packet Protocol"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Quinten-van-Woerkom/space-packet"
keywords = ["ccsds", "space-packet", "spp", "aerospace", "no-std"]
categories = ["aerospace", "parser-implementations", "no-std", "embedded", "encoding"]

[dev-dependencies]
rand = { version = "0.10.1" }

[dependencies]
ref-cast = { version = "1.0.27" }
thiserror = { version = "2.0.18", default-features = false }
zerocopy = { version = "0.8.52", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
pedantic = "warn"
nursery = "warn"
